# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob:
        - '*.{js,ts,mjs,cjs,jsx,tsx,json,jsonc,css,astro}'
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: check
      run: pnpm run check
    - name: lint
      run: pnpm run lint
    - name: content-lint
      run: pnpm run content:lint
