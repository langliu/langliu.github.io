name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/verify
      - run: pnpm run build:cloudflare
      - run: pnpm exec wrangler deploy --dry-run
