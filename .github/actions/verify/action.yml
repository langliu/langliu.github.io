name: 验证 EmDash 博客
description: 安装依赖并运行类型、Lint 和格式检查
runs:
  using: composite
  steps:
    - uses: pnpm/setup@v2
      with:
        cache: true
        install: false
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm run cf:types
      shell: bash
    - run: pnpm run check
      shell: bash
    - run: pnpm run lint
      shell: bash
    - run: pnpm run format:check
      shell: bash
